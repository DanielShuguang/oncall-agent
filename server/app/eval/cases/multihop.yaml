# 多跳型 10 条：需要「查资产 + 查政策」两类证据组合，验证 query_cmdb 与跨文档引用
- id: mh-warranty-replace
  question: 我的电脑保修到什么时候，还能申请换新吗
  expected:
    must_cite_docs: ["电脑保修与换新政策"]
    must_cite_contains: ["换新"]
    answer_must_contain: ["换新"]
    must_call: ["query_cmdb"]
  tags: [multihop, warranty]
  difficulty: hard

