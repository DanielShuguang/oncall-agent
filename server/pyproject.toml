[project]
name = "oncall-server"
version = "0.1.0"
description = "Private-deployable enterprise service-desk agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "pgvector>=0.3.5",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2.40",
  "langchain-core>=0.3.15",
  "openai>=1.50",
]
# 只保留「解析 + pgvector」必需项。embedding/rerank 走确定性实现或
# OpenAI 兼容 HTTP 接口，不把 torch / sentence-transformers 装进默认安装
# （理由见 docs/decisions/0011-offline-rag-vectorizer.md）。
rag = [
  "pypdf>=5.0",
  "python-docx>=1.1",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# RUF001-003：中文注释/文案里的全角标点是正常写法，不是拼写错误
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
plugins = []

[[tool.mypy.overrides]]
module = ["app.agent.*", "app.tools.*"]
disallow_untyped_defs = true

# langgraph 属于可选 agent extra；PyMuPDF 属于可选解析器（默认用 pypdf）。
[[tool.mypy.overrides]]
module = ["langgraph.*", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
