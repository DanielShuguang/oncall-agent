# Alembic config.
# Real DSN comes from ONCALL_DATABASE_URL via migrations/env.py; the value below
# is only a CLI placeholder (never put real credentials here).
# NOTE: keep this file ASCII-only -- alembic reads it with the locale encoding,
# and a GBK Windows box cannot decode UTF-8 comments (UnicodeDecodeError).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
sqlalchemy.url = postgresql+asyncpg://oncall:oncall@127.0.0.1:5432/oncall

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
