# 事实型 15 条：答案在单篇文档里能直接找到，验证召回与引用
# 字段说明见 app/eval/runner.py 与 docs/08-eval-metrics.md §3。
- id: fact-vpn-download
  question: VPN 客户端在哪里下载
  expected:
    must_cite_docs: ["VPN 连接失败排查指南"]
    must_cite_contains: ["内网软件库"]
    answer_must_contain: ["内网软件库"]
  tags: [fact, vpn]
  difficulty: easy

- id: fact-password-expiry
  question: 密码多少天需要更换一次
  expected:
    must_cite_docs: ["账号密码重置与锁定处理", "信息安全与密码策略"]
    must_cite_contains: ["90 天"]
    answer_must_contain: ["90 天"]
  tags: [fact, account]
  difficulty: easy

