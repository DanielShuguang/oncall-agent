[project]
name = "oncall-server"
version = "0.1.0"
description = "Private-deployable enterprise service-desk agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2.40",
  "langchain-core>=0.3.15",
  "openai>=1.50",
]
rag = [
  "pgvector>=0.3.5",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "rank-bm25>=0.2.2",
  "numpy>=2.0",
  "sentence-transformers>=3.2",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
plugins = []

[[tool.mypy.overrides]]
module = ["app.agent.*", "app.tools.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
