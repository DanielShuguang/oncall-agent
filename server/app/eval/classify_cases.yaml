# 50 条意图分类标注（W3 D11）
#
# 字段：query / intent / incident / note
# - intent ∈ knowledge | asset_check | ticket_create
# - incident ∈ hardware | network | account | software | other
# - note 只用于解释边界，不参与判定
#
# 标注口径：
# 1. 只有明确说「开单 / 报修 / 帮我申请 / 提交申请 / 申请开通」才算写操作；
#    只说「申请」「怎么办」的按知识问答处理（R10：写操作必须明确表达）。
# 2. 报修/咨询的是**具体设备**且没有开单意图 → asset_check；
#    问保修、政策、流程、时长 → knowledge，即使句子里出现设备名。
# 3. incident 按用户描述的主领域标注；一句话跨两个域时取先出现的领域。
